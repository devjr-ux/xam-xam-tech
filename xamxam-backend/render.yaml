services:
  - type: web
    name: xamxam-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categories
    envVars:
      - key: APP_NAME
        value: XamXam Tech
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://xamxam-backend.onrender.com

      # Base de données PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: xamxam-db
          property: connectionString

      # CORS — remplacer par l'URL Vercel réelle
      - key: FRONTEND_URL
        value: https://xamxam-tech.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: xamxam-tech.vercel.app

      # Session & Cache
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: xamxam-db
    databaseName: xamxam_tech
    user: xamxam_user
    plan: free
